name = "sharaga-sync"
main = "worker.js"
compatibility_date = "2025-09-01"

# Таймер воркера: раз в минуту. Именно он шлёт push о парах.
# GitHub Actions cron для этого не годится — он срабатывает раз в 3–6 часов
# вместо заявленных пяти минут, и напоминания не приходили ни разу.
[triggers]
crons = ["* * * * *"]

# Пара ключей VAPID генерируется сама при первом запуске таймера и
# складывается в KV. Задавать секреты вручную не нужно.

# Хранилище. KV вместо переменных окружения: переменная не переживает
# передеплой, и за пару минут синхронизации можно было потерять всё.
[[kv_namespaces]]
binding = "DB"
id = "ЗАМЕНИТЬ_на_реальный_id_пространства_имен"
[[kv_namespaces]]
binding = "SUBS"
id = "ЗАМЕНИТЬ_на_реальный_id_пространства_имен"
[[kv_namespaces]]
binding = "VAPID_KV"
id = "ЗАМЕНИТЬ_на_реальный_id_пространства_имен"
[[kv_namespaces]]
binding = "SETTINGS_KV"
id = "ЗАМЕНИТЬ_на_реальный_id_пространства_имен"
