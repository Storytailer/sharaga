name: Push-напоминания о парах (страховка)

# ГЛАВНОЕ. Этот workflow больше не основной отправитель напоминаний —
# он страховочный. Основной отправитель живёт в воркере (worker/worker.js)
# с таймером, который срабатывает раз в минуту.
#
# Почему cron здесь не годится: заявлено «каждые 5 минут», а по факту
# он запускался раз в 3–6 часов (замерено 27–29.09.2026: 06:48, 01:04,
# 21:24, 15:51, 07:33, 01:36, 23:08, 20:20, 17:33, 12:58). При окне поиска
# пар в 25 минут напоминание каждый раз промахивалось мимо окна — за всё
# время не пришло ни одного уведомления. Документация GitHub подтверждает,
# что schedule может задерживаться при высокой нагрузке.

on:
  schedule:
    # Много точек вместо одной: даже с задержками шансов попасть в окно больше.
    # Минуты разбросаны: на ровном часу нагрузка выше всего, туда не лезем.
    - cron: '3,8,13,18,23,28,33,38,43,48,53,58 * * * *'
  workflow_dispatch:
    inputs:
      test:
        description: 'Отправить тестовое уведомление прямо сейчас'
        type: boolean
        default: false

concurrency:
  group: push-reminders
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Установить web-push
        run: npm install --no-save --no-audit --no-fund web-push@3

      - name: Забрать состояние отправок
        run: |
          git fetch origin push-state --depth=1 2>/dev/null \
            && git show origin/push-state:sent.json > sent.json 2>/dev/null \
            || echo '{}' > sent.json
          echo "Состояние: $(wc -c < sent.json) байт"

      - name: Отправить напоминания
        env:
          VAPID_PUBLIC: ${{ secrets.VAPID_PUBLIC }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          SYNC_KEY: ${{ secrets.SYNC_KEY }}
          WORKER_URL: https://sharaga-sync.sharaga.workers.dev
          TZ_OFFSET_MIN: '180'
          # Окно = LEAD + GRACE = 195 минут. Широкое намеренно: этот cron
          # опаздывает на часы, и с узким окном напоминание проскочит мимо.
          # Воркер со своим таймером работает точнее, это страховка.
          LEAD_MIN: '15'
          GRACE_MIN: '180'
          FORCE_TEST: ${{ inputs.test && '1' || '0' }}
        run: node .github/scripts/send-reminders.js

      - name: Сохранить состояние отправок
        if: ${{ !cancelled() }}
        run: |
          if git show origin/push-state:sent.json 2>/dev/null | diff -q - sent.json >/dev/null 2>&1; then
            echo "Состояние не изменилось — коммит не нужен."
            exit 0
          fi
          tmp=$(mktemp -d)
          cp sent.json "$tmp/sent.json"
          cd "$tmp"
          git init -q -b push-state
          git config user.name "sharaga-bot"
          git config user.email "sharaga-bot@users.noreply.github.com"
          git add sent.json
          git commit -q -m "состояние отправок $(date -u +%F\ %T)Z"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" push-state
          echo "Состояние сохранено."
